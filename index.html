<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
  <title>RANZ GAMING - Mobile Legends TikTok Live Overlay</title>
  
  <!-- Modern Esports & Clean Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Orbitron:wght@700;800;900&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>

  <!-- ROOT 1080 x 1920 OVERLAY CONTAINER -->
  <main class="overlay-viewport" id="overlayViewport">
    
    <!-- 1. CINEMATIC BACKGROUND ART & ENERGY -->
    <div class="stage-bg-art"></div>
    <div class="bg-energy-gradients"></div>
    <div class="bg-mesh"></div>
    
    <!-- 2. STARDUST PARTICLES CANVAS (60 FPS) -->
    <canvas id="particleCanvas" width="1080" height="1920"></canvas>

    <!-- 3. MOBILE LEGENDS HERO ARTWORK LAYER (DECOUPLED) -->
    <div id="heroComponentContainer"></div>

    <!-- 4. A. HEADER SECTION -->
    <div id="headerComponentContainer"></div>

    <!-- 5. B. GAMEPLAY AREA (16:9 - 1008x567) -->
    <div id="gameplayComponentContainer"></div>

    <!-- 6. RUNNING MARQUEE TICKER (BELOW GAME) -->
    <div id="tickerComponentContainer"></div>

    <!-- 7. D. WEBCAM & E. LIVE CHAT SPLIT ROW -->
    <div class="cam-chat-row">
      <div id="webcamComponentContainer"></div>
      <div id="chatComponentContainer"></div>
    </div>

    <!-- 8. F. STREAM INFO CARDS (FOLLOWER, SUB, DONATION, TOP DONOR, SAWERIA) -->
    <div id="infoCardsComponentContainer"></div>

  </main>

  <!-- 9. SETTINGS & TESTING DRAWER (TOGGLE VIA 'S' OR GEAR ICON) -->
  <div id="settingsComponentContainer"></div>

  <!-- APPLICATION ENTRYPOINT (ES MODULES) -->
  <script type="module">
    import { streamConfig } from './config/streamConfig.js';
    import { liveDataAdapter } from './adapters/liveDataAdapter.js';
    import { AnimationManager } from './animations/animationManager.js';
    import { HeaderComponent } from './components/header.js';
    import { HeroLayerComponent } from './components/heroLayer.js';
    import { GameplayFrameComponent } from './components/gameplayFrame.js';
    import { TickerBarComponent } from './components/tickerBar.js';
    import { WebcamFrameComponent } from './components/webcamFrame.js';
    import { ChatPanelComponent } from './components/chatPanel.js';
    import { InfoCardsComponent } from './components/infoCards.js';
    import { SettingsPanelComponent } from './components/settingsPanel.js';

    document.addEventListener('DOMContentLoaded', () => {
      // 1. Check URL Parameters for Modes (?mode=transparent or ?mode=preview)
      const urlParams = new URLSearchParams(window.location.search);
      const modeParam = urlParams.get('mode');
      if (modeParam === 'transparent') {
        document.body.classList.add('mode-transparent');
        streamConfig.mode = 'TRANSPARENT_OVERLAY';
      }

      // Hide gear icon if in OBS mode (?obs=true)
      if (urlParams.get('obs') === 'true') {
        setTimeout(() => {
          const gear = document.getElementById('gearToggleBtn');
          if (gear) gear.style.display = 'none';
        }, 100);
      }

      // 2. Initialize Particle Animation Manager
      const canvasEl = document.getElementById('particleCanvas');
      const animManager = new AnimationManager(canvasEl, {
        particleCount: streamConfig.animations.particleCount
      });
      animManager.start();

      // 3. Mount UI Components
      const headerComp = new HeaderComponent(document.getElementById('headerComponentContainer'));
      headerComp.render();

      const heroComp = new HeroLayerComponent(document.getElementById('heroComponentContainer'));
      heroComp.render();

      const gameplayComp = new GameplayFrameComponent(document.getElementById('gameplayComponentContainer'));
      gameplayComp.render();

      const tickerComp = new TickerBarComponent(document.getElementById('tickerComponentContainer'));
      tickerComp.render();

      const webcamComp = new WebcamFrameComponent(document.getElementById('webcamComponentContainer'));
      webcamComp.render();

      const chatComp = new ChatPanelComponent(document.getElementById('chatComponentContainer'));
      chatComp.render();

      const infoCardsComp = new InfoCardsComponent(document.getElementById('infoCardsComponentContainer'));
      infoCardsComp.render();

      const settingsComp = new SettingsPanelComponent(document.getElementById('settingsComponentContainer'), {
        onUpdate: () => {}
      });
      settingsComp.render();

      console.log('RANZ GAMING Mobile Legends Overlay initialized successfully!');

      // Auto-scale to ensure 100% perfect fit on any TikTok Live Studio viewport (9:16 portrait)
      function autoFitVertical() {
        const viewport = document.getElementById('overlayViewport');
        if (!viewport) return;
        const w = window.innerWidth;
        const h = window.innerHeight;
        if (w > 0 && h > 0) {
          const scaleW = w / 1080;
          const scaleH = h / 1920;
          const finalScale = Math.min(scaleW, scaleH);
          if (Math.abs(finalScale - 1) > 0.01) {
            viewport.style.transform = scale();
            viewport.style.transformOrigin = 'top center';
          } else {
            viewport.style.transform = 'none';
          }
        }
      }
      window.addEventListener('resize', autoFitVertical);
      autoFitVertical();

    });
  </script>
</body>
</html>
